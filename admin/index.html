<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>แผงควบคุมร้าน — DTI SAU WOW COFFEE</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Chonburi&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/styles.css" />
</head>
<body>

  <header style="background:var(--espresso)">
    <div class="max-w-5xl mx-auto px-6 py-4 flex items-center justify-between">
      <span class="font-display text-lg brand-title">แผงควบคุมร้าน</span>
      <div class="flex items-center gap-4 text-sm" style="color:#D8C9B4">
        <a href="../index.html">ดูหน้าร้าน</a>
        <button id="logoutBtn" style="color:#E8B4A8">ออกจากระบบ</button>
      </div>
    </div>
  </header>

  <div class="max-w-5xl mx-auto px-6 py-8">

    <!-- Tabs -->
    <div class="flex flex-wrap gap-2 mb-8">
      <button class="tab-btn px-4 py-2 text-sm rounded-full" data-tab="orders">ออเดอร์</button>
      <button class="tab-btn px-4 py-2 text-sm rounded-full" data-tab="menu">จัดการเมนู</button>
      <button class="tab-btn px-4 py-2 text-sm rounded-full" data-tab="promotions">โปรโมชั่น</button>
      <button class="tab-btn px-4 py-2 text-sm rounded-full" data-tab="shopinfo">ข้อมูลร้าน</button>
    </div>

    <!-- ===== ออเดอร์ ===== -->
    <section id="tab-orders" class="tab-panel">
      <div id="ordersList" class="space-y-4"></div>
    </section>

    <!-- ===== จัดการเมนู ===== -->
    <section id="tab-menu" class="tab-panel hidden">
      <h2 class="font-display text-xl mb-4" style="color:var(--espresso)">เพิ่มเมนูใหม่</h2>
      <form id="menuForm" class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-10 auth-card p-5">
        <input type="hidden" id="itemId" value="" />
        <div>
          <label class="block text-sm mb-1" style="color:var(--ink-muted)">หมวดหมู่</label>
          <select id="itemCategory" class="field-input" required></select>
        </div>
        <div>
          <label class="block text-sm mb-1" style="color:var(--ink-muted)">ชื่อเมนู</label>
          <input type="text" id="itemName" class="field-input" required />
        </div>
        <div>
          <label class="block text-sm mb-1" style="color:var(--ink-muted)">ราคา</label>
          <input type="number" id="itemPrice" step="0.01" min="0" class="field-input" required />
        </div>
        <div>
          <label class="block text-sm mb-1" style="color:var(--ink-muted)">ลิงก์รูปภาพ (ถ้ามี)</label>
          <input type="text" id="itemImage" class="field-input" placeholder="https://..." />
        </div>
        <div class="sm:col-span-2">
          <label class="block text-sm mb-1" style="color:var(--ink-muted)">รายละเอียด</label>
          <input type="text" id="itemDesc" class="field-input" />
        </div>
        <div class="sm:col-span-2 flex items-center gap-2">
          <input type="checkbox" id="itemAvailable" checked />
          <label for="itemAvailable" class="text-sm" style="color:var(--ink-muted)">พร้อมขาย</label>
        </div>
        <p id="menuError" class="text-sm text-error hidden sm:col-span-2"></p>
        <div class="sm:col-span-2 flex gap-3">
          <button type="submit" id="menuSubmitBtn" class="btn-amber">บันทึกเมนู</button>
          <button type="button" id="menuCancelBtn" class="hidden text-sm" style="color:var(--ink-muted)">ยกเลิกการแก้ไข</button>
        </div>
      </form>

      <h2 class="font-display text-xl mb-4" style="color:var(--espresso)">เมนูทั้งหมด</h2>
      <div id="menuList" class="space-y-3"></div>
    </section>

    <!-- ===== โปรโมชั่น ===== -->
    <section id="tab-promotions" class="tab-panel hidden">
      <h2 class="font-display text-xl mb-4" style="color:var(--espresso)">เพิ่มโปรโมชั่น</h2>
      <form id="promoForm" class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-10 auth-card p-5">
        <input type="hidden" id="promoId" value="" />
        <div class="sm:col-span-2">
          <label class="block text-sm mb-1" style="color:var(--ink-muted)">หัวข้อ</label>
          <input type="text" id="promoTitle" class="field-input" required />
        </div>
        <div class="sm:col-span-2">
          <label class="block text-sm mb-1" style="color:var(--ink-muted)">รายละเอียด</label>
          <input type="text" id="promoDesc" class="field-input" />
        </div>
        <div>
          <label class="block text-sm mb-1" style="color:var(--ink-muted)">เริ่ม</label>
          <input type="date" id="promoStart" class="field-input" />
        </div>
        <div>
          <label class="block text-sm mb-1" style="color:var(--ink-muted)">สิ้นสุด</label>
          <input type="date" id="promoEnd" class="field-input" />
        </div>
        <div class="sm:col-span-2 flex items-center gap-2">
          <input type="checkbox" id="promoActive" checked />
          <label for="promoActive" class="text-sm" style="color:var(--ink-muted)">เปิดใช้งานอยู่</label>
        </div>
        <p id="promoError" class="text-sm text-error hidden sm:col-span-2"></p>
        <div class="sm:col-span-2 flex gap-3">
          <button type="submit" id="promoSubmitBtn" class="btn-amber">บันทึกโปรโมชั่น</button>
          <button type="button" id="promoCancelBtn" class="hidden text-sm" style="color:var(--ink-muted)">ยกเลิกการแก้ไข</button>
        </div>
      </form>

      <h2 class="font-display text-xl mb-4" style="color:var(--espresso)">โปรโมชั่นทั้งหมด</h2>
      <div id="promoList" class="space-y-3"></div>
    </section>

    <!-- ===== ข้อมูลร้าน ===== -->
    <section id="tab-shopinfo" class="tab-panel hidden">
      <h2 class="font-display text-xl mb-4" style="color:var(--espresso)">ข้อมูลร้าน</h2>
      <form id="shopForm" class="grid grid-cols-1 sm:grid-cols-2 gap-4 auth-card p-5">
        <div class="sm:col-span-2">
          <label class="block text-sm mb-1" style="color:var(--ink-muted)">ชื่อร้าน</label>
          <input type="text" id="shopName" class="field-input" />
        </div>
        <div class="sm:col-span-2">
          <label class="block text-sm mb-1" style="color:var(--ink-muted)">เรื่องราวของร้าน</label>
          <textarea id="shopStory" class="field-input" rows="3"></textarea>
        </div>
        <div class="sm:col-span-2">
          <label class="block text-sm mb-1" style="color:var(--ink-muted)">จุดเด่น</label>
          <input type="text" id="shopHighlight" class="field-input" />
        </div>
        <div>
          <label class="block text-sm mb-1" style="color:var(--ink-muted)">เวลาเปิด-ปิด</label>
          <input type="text" id="shopHours" class="field-input" />
        </div>
        <div>
          <label class="block text-sm mb-1" style="color:var(--ink-muted)">เบอร์โทร</label>
          <input type="text" id="shopPhone" class="field-input" />
        </div>
        <div class="sm:col-span-2">
          <label class="block text-sm mb-1" style="color:var(--ink-muted)">ที่ตั้ง</label>
          <input type="text" id="shopLocation" class="field-input" />
        </div>
        <div>
          <label class="block text-sm mb-1" style="color:var(--ink-muted)">Facebook URL</label>
          <input type="text" id="shopFacebook" class="field-input" />
        </div>
        <div>
          <label class="block text-sm mb-1" style="color:var(--ink-muted)">Instagram URL</label>
          <input type="text" id="shopInstagram" class="field-input" />
        </div>
        <div>
          <label class="block text-sm mb-1" style="color:var(--ink-muted)">LINE ID</label>
          <input type="text" id="shopLine" class="field-input" />
        </div>
        <p id="shopError" class="text-sm text-error hidden sm:col-span-2"></p>
        <p id="shopSuccess" class="text-sm hidden sm:col-span-2" style="color:var(--amber-dark)"></p>
        <div class="sm:col-span-2">
          <button type="submit" id="shopSubmitBtn" class="btn-amber">บันทึกข้อมูลร้าน</button>
        </div>
      </form>
    </section>

  </div>

<script src="../assets/api.js"></script>
<script>
  requireAdmin();

  const STATUS_LABEL = { pending: 'รอยืนยัน', preparing: 'กำลังเตรียม', ready: 'พร้อมรับ', completed: 'รับแล้ว', cancelled: 'ยกเลิก' };
  let categories = [];

  // ---------- Tabs ----------
  const tabButtons = document.querySelectorAll('.tab-btn');
  function setActiveTab(tab) {
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.add('hidden'));
    document.getElementById('tab-' + tab).classList.remove('hidden');
    tabButtons.forEach(btn => {
      const active = btn.dataset.tab === tab;
      btn.style.background = active ? 'var(--amber)' : '#EADFCB';
      btn.style.color = active ? 'var(--espresso)' : 'var(--ink-muted)';
    });
  }
  tabButtons.forEach(btn => btn.addEventListener('click', () => setActiveTab(btn.dataset.tab)));
  setActiveTab('orders');

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    await callApi('logout', {}, true);
    clearSession();
    window.location.href = '../login.html';
  });

  function formatMoney(n) {
    return '฿' + Number(n).toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  // ---------- ออเดอร์ ----------
  async function loadOrders() {
    const result = await callApi('adminGetAllOrders', {}, true);
    const listEl = document.getElementById('ordersList');
    if (!result.success) return;

    if (result.orders.length === 0) {
      listEl.innerHTML = `<p style="color:var(--ink-muted)">ยังไม่มีออเดอร์เข้ามา</p>`;
      return;
    }

    listEl.innerHTML = result.orders.map(order => `
      <div class="auth-card p-5">
        <div class="flex items-start justify-between mb-2">
          <div>
            <p class="font-medium">${order.customer_name || 'ลูกค้า'} · ${order.customer_phone || ''}</p>
            <p class="text-sm" style="color:var(--ink-muted)">${new Date(order.created_at).toLocaleString('th-TH', { dateStyle: 'medium', timeStyle: 'short' })}</p>
          </div>
          <span class="font-display" style="color:var(--amber-dark)">${formatMoney(order.total_amount)}</span>
        </div>
        <div class="text-sm space-y-1 mb-3" style="border-top:1px solid var(--line); padding-top:0.5rem">
          ${order.items.map(it => `<div>${it.item_name} × ${it.quantity}${it.selected_options.length ? ' (' + it.selected_options.map(o => o.choice_name).join(', ') + ')' : ''}</div>`).join('')}
        </div>
        ${order.note ? `<p class="text-sm mb-3" style="color:var(--ink-muted)">หมายเหตุ: ${order.note}</p>` : ''}
        <select class="field-input text-sm" style="max-width:200px" onchange="updateStatus('${order.order_id}', this.value)">
          ${Object.keys(STATUS_LABEL).map(s => `<option value="${s}" ${s === order.status ? 'selected' : ''}>${STATUS_LABEL[s]}</option>`).join('')}
        </select>
      </div>
    `).join('');
  }

  window.updateStatus = async function (orderId, status) {
    await callApi('adminUpdateOrderStatus', { order_id: orderId, status }, true);
    loadOrders();
  };

  // ---------- เมนู ----------
  let editingItemId = null;

  async function loadMenuForAdmin() {
    const result = await callApi('getMenu');
    if (!result.success) return;
    categories = result.categories;

    document.getElementById('itemCategory').innerHTML = categories.map(c => `<option value="${c.category_id}">${c.name}</option>`).join('');

    document.getElementById('menuList').innerHTML = result.items.map(item => `
      <div class="auth-card p-4 flex items-center justify-between gap-4">
        <div>
          <p class="font-medium">${item.name} ${item.is_available === false || item.is_available === 'FALSE' ? '<span class="text-xs" style="color:var(--error)">(หมด)</span>' : ''}</p>
          <p class="text-sm" style="color:var(--ink-muted)">${formatMoney(item.price)}</p>
        </div>
        <div class="flex gap-3 text-sm">
          <button style="color:var(--amber-dark)" onclick='editMenuItem(${JSON.stringify(item)})'>แก้ไข</button>
          <button class="text-error" onclick="deleteMenuItem('${item.item_id}')">ลบ</button>
        </div>
      </div>
    `).join('');
  }

  window.editMenuItem = function (item) {
    editingItemId = item.item_id;
    document.getElementById('itemId').value = item.item_id;
    document.getElementById('itemCategory').value = item.category_id;
    document.getElementById('itemName').value = item.name;
    document.getElementById('itemPrice').value = item.price;
    document.getElementById('itemImage').value = item.image_url || '';
    document.getElementById('itemDesc').value = item.description || '';
    document.getElementById('itemAvailable').checked = !(item.is_available === false || item.is_available === 'FALSE');
    document.getElementById('menuSubmitBtn').textContent = 'บันทึกการแก้ไข';
    document.getElementById('menuCancelBtn').classList.remove('hidden');
    setActiveTab('menu');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  document.getElementById('menuCancelBtn').addEventListener('click', resetMenuForm);

  function resetMenuForm() {
    editingItemId = null;
    document.getElementById('menuForm').reset();
    document.getElementById('itemId').value = '';
    document.getElementById('menuSubmitBtn').textContent = 'บันทึกเมนู';
    document.getElementById('menuCancelBtn').classList.add('hidden');
  }

  document.getElementById('menuForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorEl = document.getElementById('menuError');
    errorEl.classList.add('hidden');

    const data = {
      category_id: document.getElementById('itemCategory').value,
      name: document.getElementById('itemName').value.trim(),
      price: document.getElementById('itemPrice').value,
      image_url: document.getElementById('itemImage').value.trim(),
      description: document.getElementById('itemDesc').value.trim(),
      is_available: document.getElementById('itemAvailable').checked
    };

    const result = editingItemId
      ? await callApi('adminUpdateMenuItem', Object.assign({ item_id: editingItemId }, data), true)
      : await callApi('adminAddMenuItem', data, true);

    if (result.success) {
      resetMenuForm();
      loadMenuForAdmin();
    } else {
      errorEl.textContent = result.message;
      errorEl.classList.remove('hidden');
    }
  });

  window.deleteMenuItem = async function (itemId) {
    if (!confirm('ต้องการลบเมนูนี้ใช่ไหม?')) return;
    await callApi('adminDeleteMenuItem', { item_id: itemId }, true);
    loadMenuForAdmin();
  };

  // ---------- โปรโมชั่น ----------
  let editingPromoId = null;

  async function loadPromotionsForAdmin() {
    const result = await callApi('getPromotions');
    // ดึงทั้งหมดรวมที่ปิดอยู่ด้วยสำหรับ admin — ใช้ getPromotions เดิมคืนเฉพาะ active,
    // แต่ในหน้า admin ต้องการเห็นทุกอัน จึงค่อยปรับผ่านการเพิ่ม action ในอนาคตได้ถ้าจำเป็น
    if (!result.success) return;
    document.getElementById('promoList').innerHTML = result.promotions.map(p => `
      <div class="auth-card p-4 flex items-center justify-between gap-4">
        <div>
          <p class="font-medium">${p.title}</p>
          <p class="text-sm" style="color:var(--ink-muted)">${p.start_date || ''} - ${p.end_date || ''}</p>
        </div>
        <div class="flex gap-3 text-sm">
          <button style="color:var(--amber-dark)" onclick='editPromo(${JSON.stringify(p)})'>แก้ไข</button>
          <button class="text-error" onclick="deletePromo('${p.promo_id}')">ลบ</button>
        </div>
      </div>
    `).join('');
  }

  window.editPromo = function (p) {
    editingPromoId = p.promo_id;
    document.getElementById('promoId').value = p.promo_id;
    document.getElementById('promoTitle').value = p.title;
    document.getElementById('promoDesc').value = p.description || '';
    document.getElementById('promoStart').value = p.start_date || '';
    document.getElementById('promoEnd').value = p.end_date || '';
    document.getElementById('promoActive').checked = !(p.is_active === false || p.is_active === 'FALSE');
    document.getElementById('promoSubmitBtn').textContent = 'บันทึกการแก้ไข';
    document.getElementById('promoCancelBtn').classList.remove('hidden');
    setActiveTab('promotions');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  document.getElementById('promoCancelBtn').addEventListener('click', resetPromoForm);

  function resetPromoForm() {
    editingPromoId = null;
    document.getElementById('promoForm').reset();
    document.getElementById('promoId').value = '';
    document.getElementById('promoSubmitBtn').textContent = 'บันทึกโปรโมชั่น';
    document.getElementById('promoCancelBtn').classList.add('hidden');
  }

  document.getElementById('promoForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorEl = document.getElementById('promoError');
    errorEl.classList.add('hidden');

    const data = {
      title: document.getElementById('promoTitle').value.trim(),
      description: document.getElementById('promoDesc').value.trim(),
      start_date: document.getElementById('promoStart').value,
      end_date: document.getElementById('promoEnd').value,
      is_active: document.getElementById('promoActive').checked
    };

    const result = editingPromoId
      ? await callApi('adminUpdatePromotion', Object.assign({ promo_id: editingPromoId }, data), true)
      : await callApi('adminAddPromotion', data, true);

    if (result.success) {
      resetPromoForm();
      loadPromotionsForAdmin();
    } else {
      errorEl.textContent = result.message;
      errorEl.classList.remove('hidden');
    }
  });

  window.deletePromo = async function (promoId) {
    if (!confirm('ต้องการลบโปรโมชั่นนี้ใช่ไหม?')) return;
    await callApi('adminDeletePromotion', { promo_id: promoId }, true);
    loadPromotionsForAdmin();
  };

  // ---------- ข้อมูลร้าน ----------
  async function loadShopInfoForAdmin() {
    const result = await callApi('getShopInfo');
    if (!result.success || !result.shop) return;
    const s = result.shop;
    document.getElementById('shopName').value = s.shop_name || '';
    document.getElementById('shopStory').value = s.story || '';
    document.getElementById('shopHighlight').value = s.highlight || '';
    document.getElementById('shopHours').value = s.open_hours || '';
    document.getElementById('shopPhone').value = s.phone || '';
    document.getElementById('shopLocation').value = s.location || '';
    document.getElementById('shopFacebook').value = s.facebook_url || '';
    document.getElementById('shopInstagram').value = s.instagram_url || '';
    document.getElementById('shopLine').value = s.line_id || '';
  }

  document.getElementById('shopForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errorEl = document.getElementById('shopError');
    const successEl = document.getElementById('shopSuccess');
    errorEl.classList.add('hidden');
    successEl.classList.add('hidden');

    const data = {
      shop_name: document.getElementById('shopName').value.trim(),
      story: document.getElementById('shopStory').value.trim(),
      highlight: document.getElementById('shopHighlight').value.trim(),
      open_hours: document.getElementById('shopHours').value.trim(),
      phone: document.getElementById('shopPhone').value.trim(),
      location: document.getElementById('shopLocation').value.trim(),
      facebook_url: document.getElementById('shopFacebook').value.trim(),
      instagram_url: document.getElementById('shopInstagram').value.trim(),
      line_id: document.getElementById('shopLine').value.trim()
    };

    const result = await callApi('adminUpdateShopInfo', data, true);
    if (result.success) {
      successEl.textContent = 'บันทึกข้อมูลร้านสำเร็จ';
      successEl.classList.remove('hidden');
    } else {
      errorEl.textContent = result.message;
      errorEl.classList.remove('hidden');
    }
  });

  loadOrders();
  loadMenuForAdmin();
  loadPromotionsForAdmin();
  loadShopInfoForAdmin();
</script>

</body>
</html>
